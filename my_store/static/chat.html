<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Assistant</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #1f5f4a; --accent-ink: #ffffff; --me: #1f5f4a; --me-ink: #ffffff; --chip: #eef3f0;
    --warn: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151615; --panel: #1f201f; --ink: #ecebe7; --muted: #a09f99; --line: #33342f;
      --accent: #6fbf9f; --accent-ink: #0f1a15; --me: #2b6b55; --me-ink: #ffffff; --chip: #23302a;
      --warn: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .head-actions { display: flex; gap: 8px; align-items: center; }
  #close-btn { border: 0; background: transparent; color: var(--ink); font-size: 24px; line-height: 1; cursor: pointer; padding: 0 4px; }
  #close-btn[hidden] { display: none; }
  #cart-btn {
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  main { flex: 1; overflow-y: auto; }
  #log { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .status { align-self: flex-start; color: var(--muted); font-size: 13px; font-style: italic; }
  .error { align-self: flex-start; color: var(--warn); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 14px;
  }
  .card-title { font-weight: 600; margin: 4px 0 8px; }
  .products { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
  .product {
    flex: 0 0 220px; scroll-snap-align: start; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
  }
  .product img { width: 100%; height: 140px; object-fit: cover; background: var(--line); }
  .product .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .product .name { font-weight: 600; font-size: 14px; }
  .product .price { font-variant-numeric: tabular-nums; }
  .product .reason { color: var(--muted); font-size: 13px; }
  .product .oos { color: var(--warn); font-size: 13px; }
  .product button, .primary {
    margin-top: auto; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; text-align: center;
  }
  a.plink { color: inherit; text-decoration: none; display: block; }
  th a.plink, .lines a.plink { display: inline; text-decoration: underline; text-underline-offset: 2px; }
  .product .view { font-size: 13px; text-align: center; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .product button[disabled] { opacity: .5; cursor: default; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .lines li { display: flex; align-items: center; gap: 10px; }
  .lines img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: var(--line); }
  .lines .t { flex: 1; font-size: 14px; }
  .lines .p { font-variant-numeric: tabular-nums; }
  .total { display: flex; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; font-weight: 600; }
  .note { color: var(--muted); font-size: 14px; margin: 8px 0; }
  .handoffs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .intro { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; counter-reset: step; }
  .steps > li { counter-increment: step; }
  .steps .label { font-weight: 600; }
  .steps .label::before { content: counter(step) ". "; color: var(--muted); }
  .steps.days .label::before { content: none; }
  .steps .detail, .section p { color: var(--muted); font-size: 14px; margin: 4px 0 8px; }
  .section + .section { margin-top: 12px; }
  .section h3 { font-size: 15px; margin: 0; }
  .sources { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .compare { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .compare .product.pick { border-color: var(--accent); }
  .badge { align-self: flex-start; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
  .pc { margin: 0; padding-left: 18px; font-size: 13px; }
  .pc.pro li::marker { content: "+  "; }
  .pc.con li::marker { content: "−  "; }
  .matrix-wrap { overflow-x: auto; }
  table.matrix { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.matrix th, table.matrix td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.matrix thead th { font-weight: 600; }
  table.matrix tbody th { color: var(--muted); font-weight: 400; white-space: nowrap; }
  table.matrix .pick { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  table.matrix button { border: 0; border-radius: 8px; padding: 6px 10px; background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 13px; cursor: pointer; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .status-pill { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; text-transform: capitalize; }
  #cart-drawer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  #cart-drawer[hidden] { display: none; }
  #checkout-bar { max-width: 760px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 6px; }
  #checkout-bar[hidden], #checkout-bar [hidden] { display: none; }
  #checkout-bar .primary { width: 100%; text-align: center; }
  .buy { display: flex; flex-direction: column; gap: 6px; }
  .variants { display: flex; flex-wrap: wrap; gap: 6px; }
  .variants button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .variants button[disabled] { opacity: .45; text-decoration: line-through; cursor: default; }
  .buy .msg-err { color: var(--warn); font-size: 12px; }
  .buy .added { color: var(--accent); font-size: 13px; font-weight: 600; }
  footer { border-top: 1px solid var(--line); background: var(--panel); }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; padding: 12px 16px; }
  input[type=text] {
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font: inherit; background: var(--bg); color: var(--ink);
  }
  form button { border: 0; border-radius: 10px; padding: 0 16px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
  form button[disabled] { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Shopping Assistant</h1>
  <div class="head-actions">
    <button id="cart-btn" type="button">Cart (0)</button>
    <button id="close-btn" type="button" aria-label="Close" hidden>&times;</button>
  </div>
</header>
<main id="scroller">
  <div id="cart-drawer" hidden></div>
  <div id="log" aria-live="polite"></div>
</main>
<footer>
  <div id="checkout-bar" hidden>
    <button id="checkout-btn" type="button" class="primary"></button>
    <a id="checkout-go" class="primary" hidden rel="noopener">Continue to secure checkout →</a>
    <div id="checkout-msg" class="error" hidden></div>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask about products, policies, or your cart…" autocomplete="off" required>
    <button id="send" type="submit">Send</button>
  </form>
</footer>
<script>
(() => {
  const log = document.getElementById("log");
  const scroller = document.getElementById("scroller");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const cartBtn = document.getElementById("cart-btn");
  const drawer = document.getElementById("cart-drawer");
  const checkoutBar = document.getElementById("checkout-bar");
  const checkoutBtn = document.getElementById("checkout-btn");
  const checkoutGo = document.getElementById("checkout-go");
  const checkoutMsg = document.getElementById("checkout-msg");
  const embedded = new URLSearchParams(location.search).has("embed");
  const SESSION_KEY = "shopping-assistant-session";
  const saved = {
    get: () => { try { return sessionStorage.getItem(SESSION_KEY); } catch { return null; } },
    set: (v) => { try { v ? sessionStorage.setItem(SESSION_KEY, v) : sessionStorage.removeItem(SESSION_KEY); } catch {} },
  };
  let sessionId = null;
  let busy = false;
  let cart = { items: [], item_count: 0, subtotal: 0, currency: "" };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const money = (v, c) => {
    try { return new Intl.NumberFormat(undefined, { style: "currency", currency: c || "USD" }).format(v); }
    catch { return `${Number(v).toFixed(2)} ${c || ""}`.trim(); }
  };
  const scrollDown = () => { scroller.scrollTop = scroller.scrollHeight; };
  const add = (node) => { log.appendChild(node); scrollDown(); return node; };
  // Plain text with **bold** only; everything else is escaped by textContent.
  const setText = (node, text) => {
    node.replaceChildren();
    text.split(/(\*\*[^*]+\*\*)/g).forEach((part) => {
      if (part.startsWith("**") && part.endsWith("**") && part.length > 4) node.appendChild(el("strong", null, part.slice(2, -2)));
      else if (part) node.appendChild(document.createTextNode(part));
    });
  };

  async function ensureSession() {
    if (sessionId) return sessionId;
    const r = await fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
    if (!r.ok) throw new Error(await problem(r));
    sessionId = (await r.json()).session_id;
    saved.set(sessionId);
    return sessionId;
  }

  async function problem(r) {
    try { const j = await r.json(); if (j && typeof j.detail === "string") return j.detail; } catch {}
    return `Request failed (${r.status})`;
  }

  function renderCart() {
    const n = cart.item_count || 0;
    cartBtn.textContent = `Cart (${n})`;
    drawer.replaceChildren(cartPanel(cart, "Your cart"));
    // The happy path ends here: one tap stages checkout, the next opens Shopify's checkout.
    checkoutBar.hidden = n === 0;
    checkoutBtn.textContent = `Checkout · ${n} item${n === 1 ? "" : "s"} · ${money(cart.subtotal || 0, cart.currency)}`;
    checkoutBtn.hidden = false; checkoutGo.hidden = true; checkoutMsg.hidden = true;
  }

  async function api(path, payload) {
    await ensureSession();
    const r = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json", "x-session-id": sessionId },
      body: JSON.stringify(payload || {}),
    });
    if (r.status === 401) { sessionId = null; saved.set(null); throw new Error("Your chat expired. Ask again to continue."); }
    if (!r.ok) throw new Error(await problem(r));
    return r.json();
  }

  async function addDirect(productId, label, box) {
    box.querySelectorAll(".msg-err, .added").forEach((n) => n.remove());
    try {
      cart = await api("/api/cart/add", { product_id: productId, quantity: 1 });
      renderCart();
      box.appendChild(el("div", "added", `Added ${label} to your cart ✓`));
    } catch (e) {
      box.appendChild(el("div", "msg-err", e.message));
    }
  }

  // Add to cart straight from a card; a product with options shows its variants first.
  function buyControls(product, compact) {
    const box = el("div", "buy");
    const hasOptions = Object.keys(product.options || {}).length > 0;
    const b = el("button", null, hasOptions ? (compact ? "Choose" : "Choose options") : (compact ? "Add" : "Add to cart"));
    b.type = "button";
    b.disabled = product.in_stock === false;
    b.onclick = async () => {
      if (!hasOptions) { b.disabled = true; await addDirect(product.product_id, product.title, box); b.disabled = false; return; }
      b.disabled = true;
      try {
        const d = await api("/api/product/options", { product_id: product.product_id });
        const row = el("div", "variants");
        (d.variants || []).forEach((v) => {
          const name = Object.values(v.option_values || {}).join(" / ") || "Standard";
          const label = v.price != null && v.price !== product.price ? `${name} · ${money(v.price, v.currency)}` : name;
          const vb = el("button", null, label); vb.type = "button";
          vb.disabled = v.in_stock === false;
          if (v.in_stock === false) vb.title = "Sold out";
          vb.onclick = () => addDirect(v.product_id, `${product.title} (${name})`, box);
          row.appendChild(vb);
        });
        if (!row.children.length) throw new Error("No options available right now.");
        b.replaceWith(row);
      } catch (e) {
        b.disabled = false;
        // Fall back to the assistant, which can explain the options in words.
        ask(`I'd like the ${product.title}. What options are there?`);
      }
    };
    box.appendChild(b);
    return box;
  }

  function cartPanel(c, title) {
    const box = el("div", "panel");
    box.appendChild(el("div", "card-title", title));
    if (!c.items || !c.items.length) { box.appendChild(el("div", "note", "Your cart is empty.")); return box; }
    const ul = el("ul", "lines");
    c.items.forEach((it) => {
      const li = el("li");
      const img = el("img"); img.alt = ""; if (it.image_url) img.src = it.image_url; li.appendChild(img);
      li.appendChild(el("span", "t", `${it.title} × ${it.quantity}`));
      li.appendChild(el("span", "p", money(it.line_total ?? it.price * it.quantity, c.currency)));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    const tot = el("div", "total");
    tot.appendChild(el("span", null, "Subtotal"));
    tot.appendChild(el("span", null, money(c.subtotal, c.currency)));
    box.appendChild(tot);
    return box;
  }

  // The product's page in the store; in the storefront bubble it opens in the same tab.
  const productUrl = (product) => {
    const u = product && product.attributes && product.attributes.product_url;
    return typeof u === "string" && /^https:\/\//.test(u) ? u : null;
  };
  const productLink = (product, child) => {
    const url = productUrl(product);
    if (!url) return child;
    const a = el("a", "plink"); a.href = url; a.rel = "noopener";
    a.target = embedded ? "_top" : "_blank";
    a.appendChild(child);
    return a;
  };

  function productCard(product, reason) {
    const card = el("div", "product");
    if (product.image_url) {
      const img = el("img"); img.alt = product.title || ""; img.loading = "lazy";
      img.src = product.image_url;
      card.appendChild(productLink(product, img));
    }
    const body = el("div", "body");
    body.appendChild(productLink(product, el("div", "name", product.title)));
    if (product.price != null) body.appendChild(el("div", "price", money(product.price, product.currency)));
    if (reason) body.appendChild(el("div", "reason", reason));
    const opts = Object.entries(product.options || {});
    if (opts.length) body.appendChild(el("div", "reason", opts.map(([k, v]) => `${k}: ${[].concat(v).join(", ")}`).join(" · ")));
    if (product.in_stock === false) body.appendChild(el("div", "oos", "Out of stock"));
    body.appendChild(buyControls(product, false));
    if (productUrl(product)) body.appendChild(productLink(product, el("span", "view", "View details")));
    card.appendChild(body);
    return card;
  }

  function productRow(products) {
    const row = el("div", "products");
    products.forEach((pr) => { if (pr) row.appendChild(productCard(pr)); });
    return row;
  }

  function productsCard(p) {
    const wrap = el("div");
    if (p.title) wrap.appendChild(el("div", "card-title", p.title));
    const row = el("div", "products");
    (p.items || []).forEach(({ product, reason }) => { if (product) row.appendChild(productCard(product, reason)); });
    wrap.appendChild(row);
    return wrap;
  }

  // A plan toward a goal (a trip, an outfit): numbered steps, each with its products.
  function planCard(p) {
    const box = el("div", "panel");
    if (p.title) box.appendChild(el("div", "card-title", p.title));
    if (p.intro) box.appendChild(el("p", "intro", p.intro));
    const ol = el("ol", "steps");
    (p.steps || []).forEach((st) => {
      const li = el("li");
      li.appendChild(el("div", "label", st.label));
      if (st.detail) li.appendChild(el("div", "detail", st.detail));
      if (st.products && st.products.length) li.appendChild(productRow(st.products));
      ol.appendChild(li);
    });
    box.appendChild(ol);
    return box;
  }

  // Know-how, an idea, or an itinerary: short sections, then related products.
  function guideCard(p) {
    const box = el("div", "panel");
    if (p.title) box.appendChild(el("div", "card-title", p.title));
    (p.sections || []).forEach((sec) => {
      const d = el("div", "section");
      d.appendChild(el("h3", null, sec.heading));
      const para = el("p"); setText(para, sec.body || ""); d.appendChild(para);
      box.appendChild(d);
    });
    if (p.related_products && p.related_products.length) box.appendChild(productRow(p.related_products));
    if (p.sources && p.sources.length) box.appendChild(el("div", "sources", "Sources: " + p.sources.join(" · ")));
    return box;
  }

  function comparisonCard(p) {
    const wrap = el("div");
    if (p.title) wrap.appendChild(el("div", "card-title", p.title));
    if (p.dimensions && p.dimensions.length) wrap.appendChild(el("p", "intro", "Comparing " + p.dimensions.join(", ")));
    const row = el("div", "compare");
    (p.entries || []).forEach((e) => {
      if (!e.product) return;
      const card = productCard(e.product, e.best_for ? `Best for ${e.best_for}` : null);
      const body = card.querySelector(".body");
      const btn = body.querySelector("button");
      if (e.product_id && e.product_id === p.recommended_product_id) {
        card.classList.add("pick");
        body.insertBefore(el("span", "badge", "Recommended"), body.firstChild);
      }
      [["pro", e.pros], ["con", e.cons]].forEach(([kind, list]) => {
        if (!list || !list.length) return;
        const ul = el("ul", "pc " + kind);
        list.forEach((t) => ul.appendChild(el("li", null, t)));
        body.insertBefore(ul, btn);
      });
      row.appendChild(card);
    });
    wrap.appendChild(row);
    const d = p.price_delta;
    if (d && d.amount) wrap.appendChild(el("p", "note", `Price difference: ${money(d.amount, (p.entries[0] && p.entries[0].product && p.entries[0].product.currency) || undefined)}`));
    return wrap;
  }

  function orderCard(p) {
    const o = p.order || {};
    const box = el("div", "panel");
    const head = el("div", "card-title", `Order ${o.order_id || p.order_id || ""}`.trim());
    box.appendChild(head);
    if (o.status) box.appendChild(el("span", "status-pill", String(o.status).replace(/_/g, " ")));
    if (p.summary) box.appendChild(el("p", "note", p.summary));
    if (o.items && o.items.length) {
      const ul = el("ul", "lines");
      o.items.forEach((it) => {
        const li = el("li");
        li.appendChild(el("span", "t", `${it.title} × ${it.quantity}`));
        li.appendChild(el("span", "p", money(it.price * it.quantity, o.currency)));
        ul.appendChild(li);
      });
      box.appendChild(ul);
    }
    const dl = el("dl", "kv");
    const row = (k, v) => { if (v) { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); } };
    if (o.total != null) row("Total", money(o.total, o.currency));
    if (o.placed_at) row("Placed", new Date(o.placed_at).toLocaleDateString());
    row("Expected", o.estimated_delivery);
    if (dl.children.length) box.appendChild(dl);
    if (p.next_step) box.appendChild(el("p", "note", p.next_step));
    if (o.tracking_url) {
      const a = el("a", "primary", "Track package");
      a.href = o.tracking_url; a.rel = "noopener"; a.target = "_blank";
      box.appendChild(a);
    }
    return box;
  }

  // A trip, outing, or event weekend, day by day, with products on each day.
  function itineraryCard(p) {
    const box = el("div", "panel");
    if (p.title) box.appendChild(el("div", "card-title", p.title));
    if (p.travel_dates) box.appendChild(el("p", "intro", p.travel_dates));
    const ol = el("ol", "steps days"); // day labels carry their own numbers
    (p.days || []).forEach((d) => {
      const li = el("li");
      li.appendChild(el("div", "label", d.label));
      if (d.note) li.appendChild(el("div", "detail", d.note));
      if (d.products && d.products.length) li.appendChild(productRow(d.products));
      ol.appendChild(li);
    });
    box.appendChild(ol);
    return box;
  }

  // Plans, packages, or ticket types side by side; every cell comes from the catalog.
  function planMatrixCard(p) {
    const plans = p.plans || [];
    const best = Object.fromEntries((p.annotations || []).map((a) => [a.plan_id, a.best_for]));
    const box = el("div", "panel");
    if (p.title) box.appendChild(el("div", "card-title", p.title));
    const wrap = el("div", "matrix-wrap");
    const table = el("table", "matrix");
    const pickCls = (pl) => (pl.product_id === p.recommended_plan_id ? "pick" : null);
    const head = el("tr"); head.appendChild(el("th"));
    plans.forEach((pl) => {
      const th = el("th", pickCls(pl));
      if (pl.product_id === p.recommended_plan_id) { th.appendChild(el("span", "badge", "Recommended")); th.appendChild(el("br")); }
      th.appendChild(productLink(pl, document.createTextNode(pl.title)));
      head.appendChild(th);
    });
    const thead = el("thead"); thead.appendChild(head); table.appendChild(thead);
    const tbody = el("tbody");
    const addRow = (label, cells) => {
      const tr = el("tr"); tr.appendChild(el("th", null, label));
      cells.forEach((c, i) => { const td = el("td", pickCls(plans[i])); typeof c === "string" ? (td.textContent = c) : td.appendChild(c); tr.appendChild(td); });
      tbody.appendChild(tr);
    };
    (p.rows || []).forEach((r) => addRow(r.label, r.values || []));
    if (Object.keys(best).length) addRow("Best for", plans.map((pl) => best[pl.product_id] || "—"));
    addRow("", plans.map((pl) => buyControls(pl, true)));
    table.appendChild(tbody); wrap.appendChild(table); box.appendChild(wrap);
    return box;
  }

  // A facts box the store authors in full (e.g. a product disclosure).
  function disclosureCard(p) {
    const box = el("div", "panel");
    if (p.title) box.appendChild(el("div", "card-title", p.title));
    const dl = el("dl", "kv");
    (p.rows || []).forEach((r) => {
      dl.appendChild(el("dt", null, r.label));
      dl.appendChild(el("dd", null, r.note ? `${r.value} (${r.note})` : r.value));
    });
    box.appendChild(dl);
    (p.footnotes || []).forEach((f) => box.appendChild(el("p", "sources", f)));
    if (p.sources && p.sources.length) box.appendChild(el("div", "sources", "Sources: " + p.sources.join(" · ")));
    return box;
  }

  function checkoutCard(p) {
    const box = p.cart ? cartPanel(p.cart, "Checkout") : el("div", "panel");
    if (p.note) box.appendChild(el("div", "note", p.note));
    const hs = el("div", "handoffs");
    (p.handoffs || []).forEach((h) => {
      const a = el("a", "primary", h.label || "Check out");
      a.href = h.url; a.rel = "noopener";
      a.target = embedded ? "_top" : "_blank"; // in the store, check out in the same tab
      hs.appendChild(a);
    });
    box.appendChild(hs);
    return box;
  }

  function suggestions(p) {
    const row = el("div", "chips");
    (p.suggestions || []).forEach((s) => {
      const b = el("button", "chip", s); b.type = "button";
      b.onclick = () => ask(s);
      row.appendChild(b);
    });
    return row;
  }

  function renderUi(data) {
    const p = data.payload || {};
    switch (data.component) {
      case "products": return add(productsCard(p));
      case "checkout": return add(checkoutCard(p));
      case "suggestions": return add(suggestions(p));
      case "plan": return add(planCard(p));
      case "guide": return add(guideCard(p));
      case "comparison": return add(comparisonCard(p));
      case "order_status": return add(orderCard(p));
      case "disclosure": return add(disclosureCard(p));
      case "itinerary": return add(itineraryCard(p));
      case "plan_matrix": return add(planMatrixCard(p));
      default: {
        // A component this page doesn't know yet: show its heading, never raw data.
        const box = el("div", "panel");
        box.appendChild(el("div", "card-title", p.title || "Details"));
        return add(box);
      }
    }
  }

  async function ask(text) {
    if (busy || !text.trim()) return;
    busy = true; send.disabled = true;
    log.querySelectorAll(".chips").forEach((n) => n.remove()); // old suggestions go stale
    add(el("div", "msg me", text));
    let bubble = null, buf = "";
    const status = add(el("div", "status", "Thinking…"));
    try {
      await ensureSession();
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json", "x-session-id": sessionId },
        body: JSON.stringify({ message: text }),
      });
      if (r.status === 401) { sessionId = null; saved.set(null); throw new Error("Session expired. Send your message again."); }
      if (!r.ok || !r.body) throw new Error(await problem(r));
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let pending = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        pending += dec.decode(value, { stream: true });
        let cut;
        while ((cut = pending.indexOf("\n\n")) !== -1) {
          const block = pending.slice(0, cut); pending = pending.slice(cut + 2);
          let ev = "message", data = "";
          block.split("\n").forEach((line) => {
            if (line.startsWith("event:")) ev = line.slice(6).trim();
            else if (line.startsWith("data:")) data += line.slice(5).trim();
          });
          if (!data) continue;
          let d; try { d = JSON.parse(data); } catch { continue; }
          if (ev === "text_delta") {
            if (!bubble) { bubble = el("div", "msg bot"); log.insertBefore(bubble, status); }
            buf += d.text || ""; setText(bubble, buf); scrollDown();
          } else if (ev === "tool_call") {
            status.textContent = (d.label || "Working") + "…";
          } else if (ev === "ui") {
            bubble = null; buf = ""; // text after a card starts a new bubble
            log.insertBefore(renderUi(d), status);
          } else if (ev === "cart_update") {
            cart = d.cart || cart; renderCart();
          } else if (ev === "error") {
            log.insertBefore(el("div", "error", d.message || "Something went wrong."), status);
          }
        }
      }
    } catch (e) {
      add(el("div", "error", e.message || String(e)));
    } finally {
      status.remove();
      busy = false; send.disabled = false; input.focus(); scrollDown();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const t = input.value; input.value = ""; ask(t);
  });
  checkoutBtn.addEventListener("click", async () => {
    checkoutBtn.disabled = true; checkoutMsg.hidden = true;
    try {
      const card = await api("/api/checkout");
      const url = (card.handoffs || [])[0] && card.handoffs[0].url;
      if (!url) throw new Error("Checkout isn't available right now. Ask the assistant for help.");
      add(checkoutCard(card));
      checkoutGo.href = url;
      checkoutGo.target = embedded ? "_top" : "_blank"; // in the store, check out in the same tab
      checkoutBtn.hidden = true; checkoutGo.hidden = false;
    } catch (e) {
      checkoutMsg.textContent = e.message; checkoutMsg.hidden = false;
    } finally {
      checkoutBtn.disabled = false;
    }
  });
  cartBtn.addEventListener("click", async () => {
    drawer.hidden = !drawer.hidden;
    if (!drawer.hidden && sessionId) {
      try {
        const r = await fetch("/api/cart", { headers: { "x-session-id": sessionId } });
        if (r.ok) cart = await r.json();
      } catch {}
    }
    renderCart();
    if (!drawer.hidden) scroller.scrollTop = 0;
  });
  if (embedded) {
    const close = document.getElementById("close-btn");
    close.hidden = false;
    close.addEventListener("click", () => parent.postMessage({ type: "shopping-assistant:close" }, "*"));
  }

  // Picks the chat back up after the shopper moves to another page of the store.
  async function resume() {
    const id = saved.get();
    if (!id) return false;
    try {
      const h = await fetch("/api/history", { headers: { "x-session-id": id } });
      if (!h.ok) { saved.set(null); return false; }
      sessionId = id;
      const { turns } = await h.json();
      turns.forEach((t) => { const n = el("div", `msg ${t.role === "user" ? "me" : "bot"}`); setText(n, t.text); add(n); });
      const c = await fetch("/api/cart", { headers: { "x-session-id": id } });
      if (c.ok) cart = await c.json();
      return turns.length > 0;
    } catch { return false; }
  }

  renderCart();
  resume().then((resumed) => {
    renderCart();
    if (!resumed) add(el("div", "msg bot", "Hi! What are you looking for today?"));
    if (!embedded) input.focus();
  });
})();
</script>
</body>
</html>
